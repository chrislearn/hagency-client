<!doctype html><html><head><meta charset="utf-8"><title>Editor.md comparison</title><style>html,body{margin:0;background:#ffffff;color:#191919;font-family:"PingFang SC",system-ui,sans-serif}
article{box-sizing:border-box;max-width:760px;margin:0 auto;padding:24px;font-size:16px;line-height:1.85;overflow-wrap:break-word}
h1{font-size:28px;line-height:1.4} h2{font-size:22px;color:#07a858;margin-top:28px}
h3{font-size:19px} p{margin:16px 0} .author,figcaption{font-size:13px;opacity:.7}
blockquote{margin:20px 0;padding:12px 18px;border-left:4px solid #07a858;background:#f0f2ef}
figure{margin:20px auto;text-align:center} figure img{width:100%;max-width:100%;height:auto} a{color:#07a858} hr{border:0;border-top:1px solid #07a858;margin:24px 0}


table{border-collapse:collapse;width:100%;margin:18px 0;font-size:.9em;table-layout:fixed}
th,td{border:1px solid #b8c2bd;padding:8px;overflow-wrap:anywhere}th{background:#edf2ef;font-weight:bold}
td[align=right],th[align=right]{text-align:right}td[align=center],th[align=center]{text-align:center}
pre{background:#f3f5f4;border:1px solid #dde3df;border-radius:4px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;font-size:13px}
code{font-family:Menlo,Consolas,monospace}p code,li code,td code{background:#f0f2f1;padding:2px 3px}
img{max-width:100%;height:auto}pre code{padding:0;background:transparent}
