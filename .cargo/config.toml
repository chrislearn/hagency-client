## Add these flags onto all target builds cumulatively.
## <https://github.com/rust-lang/cargo/issues/5376#issuecomment-2163350032>
[target.'cfg(all())']
rustflags = ["--cfg", "ruma_identifiers_storage=\"Arc\""]

## This is a little hack that lets `cargo run` on macOS behave like an app bundle,
## which allows things like speech-to-text and permissions prompts to work.
## The script uses ad-hoc development codesigning, so no apple developer account
## is needed.
## If it fails, the script falls back to running the binary directly as normal.
[target.'cfg(target_os = "macos")']
runner = "tools/run-native.sh"

## Keep the published bundle identity and use the same branding in native windows.
[env]
MAKEPAD_BUNDLE_IDENTIFIER = { value = "org.hagency.desktop", force = true }
MAKEPAD_BUNDLE_NAME = { value = "Hagency", force = true }
## Makepad's development icon auto-discovery is based on the target directory.
## Explicit source paths also work with an external CARGO_TARGET_DIR.
MAKEPAD_APP_ICON_32 = { value = "crates/hagency-app/resources/icon_32.png", relative = true, force = true }
MAKEPAD_APP_ICON_64 = { value = "crates/hagency-app/resources/icon_64.png", relative = true, force = true }
MAKEPAD_APP_ICON_128 = { value = "crates/hagency-app/resources/icon_128.png", relative = true, force = true }
MAKEPAD_APP_ICON_256 = { value = "crates/hagency-app/resources/icon_256.png", relative = true, force = true }
MAKEPAD_APP_ICON_512 = { value = "crates/hagency-app/resources/icon_512.png", relative = true, force = true }
MAKEPAD_APP_ICON_1024 = { value = "crates/hagency-app/resources/icon_1024.png", relative = true, force = true }
MAKEPAD_APP_ICON_ICO = { value = "crates/hagency-app/resources/icon.ico", relative = true, force = true }
## The minimum version supported for speech-to-text and other native features.
MACOSX_DEPLOYMENT_TARGET = "12.0"
