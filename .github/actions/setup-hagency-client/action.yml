name: Setup pinned Hagency client
description: Provide the sibling source dependency required by Desktop Cargo.toml.
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        repository: chrislearn/hagency-client
        # Update this pin together with Desktop integration and Cargo.lock.
        ref: 58e2d63cb964d9660dfdf311fd8f886d0b7c60ae
        path: .ci/hagency-client
        persist-credentials: false
    - shell: bash
      run: |
        set -euo pipefail
        test ! -e "$GITHUB_WORKSPACE/../hagency-client"
        mv "$GITHUB_WORKSPACE/.ci/hagency-client" "$GITHUB_WORKSPACE/../hagency-client"
        test -f "$GITHUB_WORKSPACE/../hagency-client/native/hagency/Cargo.toml"
